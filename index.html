  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  function fmtDate(d){
    if(!d) return "";
    const parts = d.split("-");
    if(parts.length !== 3) return d;
    return parts[2] + "." + parts[1] + "." + parts[0];
  }
  function addDays(dateStr, days){
    const d = new Date(dateStr);
    d.setDate(d.getDate() + days);
    return d.toISOString().slice(0,10);
  }
  function isOverdue(dateStr){
    if(!dateStr) return false;
    const today = new Date(); today.setHours(0,0,0,0);
    const d = new Date(dateStr);
    return d <= today;
  }
  function formatBytes(n){
    if(n < 1024) return n + " B";
    if(n < 1024*1024) return Math.round(n/1024) + " KB";
    return (n/(1024*1024)).toFixed(1) + " MB";
  }
  function dataURLtoBlob(dataURL){
    const commaIdx = dataURL.indexOf(",");
    const header = dataURL.slice(0, commaIdx);
    const base64 = dataURL.slice(commaIdx + 1);
    const mimeMatch = header.match(/data:(.*?);base64/);
    const mime = mimeMatch ? mimeMatch[1] : "application/octet-stream";
    const binary = atob(base64);
    const len = binary.length;
    const bytes = new Uint8Array(len);
    for(let i = 0; i < len; i++){ bytes[i] = binary.charCodeAt(i); }
    return new Blob([bytes], { type: mime });
  }

  // ---------- IndexedDB (f\u00fcr grosse Dateianh\u00e4nge, deutlich mehr Platz als localStorage) ----------
  const IDB_NAME = "tierkartei-files-db";
  const IDB_STORE = "files";
  function idbOpen(){
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded = () => { req.result.createObjectStore(IDB_STORE); };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  async function idbSet(key, value){
    const db = await idbOpen();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, "readwrite");
      tx.objectStore(IDB_STORE).put(value, key);
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => reject(tx.error);
    });
  }
  async function idbGet(key){
    const db = await idbOpen();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, "readonly");
      const req = tx.objectStore(IDB_STORE).get(key);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  async function idbDelete(key){
    const db = await idbOpen();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, "readwrite");
      tx.objectStore(IDB_STORE).delete(key);
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => reject(tx.error);
    });
  }

  function resizeImageToDataUrl(file, maxDim, quality){
    return new Promise((resolve, reject) => {
      const img = new Image();
      const reader = new FileReader();
      reader.onload = () => {
        img.onload = () => {
          let w = img.width, h = img.height;
          if(w > h && w > maxDim){ h = Math.round(h * (maxDim / w)); w = maxDim; }
          else if(h > maxDim){ w = Math.round(w * (maxDim / h)); h = maxDim; }
          const canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          canvas.getContext("2d").drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL("image/jpeg", quality));
        };
        img.onerror = reject;
        img.src = reader.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function buildAnimalPdf(animal){
    if(!window.jspdf || !window.jspdf.jsPDF){
      alert("PDF-Bibliothek konnte nicht geladen werden. Bitte pr\u00fcfe deine Internetverbindung und versuch es erneut.");
      return;
    }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const pageWidth = doc.internal.pageSize.getWidth();
    let y = 20;

    try{ doc.addImage(LOGO_DATA_URL, "PNG", 14, 10, 18, 18); }catch(e){}
    const textX = 38;

    if(animal.photo){
      try{ doc.addImage(animal.photo, "JPEG", pageWidth - 40, 12, 26, 26); }catch(e){}
    }

    doc.setFont("helvetica", "bold");
    doc.setFontSize(20);
    doc.text(animal.name || "(ohne Namen)", textX, y);
    y += 8;
    doc.setFont("helvetica", "normal");
    doc.setFontSize(11);
    doc.text(animal.species || "Tierart unbekannt", textX, y);
    y += 10;

    doc.setFontSize(10);
    const stammdaten = [
      ["Rasse", animal.breed || "\u2014"],
      ["Geburtsdatum", animal.birthdate ? fmtDate(animal.birthdate) : "\u2014"],
      ["Notizen", animal.notes || "\u2014"]
    ];
    doc.autoTable({
      startY: y, theme: "plain", styles: { fontSize: 10, cellPadding: 1.5 },
      columnStyles: { 0: { fontStyle: "bold", cellWidth: 35 } },
      body: stammdaten
    });
    y = doc.lastAutoTable.finalY + 8;

    function addSection(title, head, rows, emptyText){
      if(y > 260){ doc.addPage(); y = 20; }
      doc.setFont("helvetica", "bold");
      doc.setFontSize(13);
      doc.text(title, 14, y);
      y += 3;
      if(rows.length === 0){
        doc.setFont("helvetica", "normal");
        doc.setFontSize(10);
        doc.text(emptyText, 14, y + 6);
        y += 14;
      } else {
        doc.autoTable({
          startY: y + 3, head: [head], body: rows,
          styles: { fontSize: 9, cellPadding: 2.5 },
          headStyles: { fillColor: [47, 69, 54] },
          margin: { left: 14, right: 14 }
        });
        y = doc.lastAutoTable.finalY + 8;
      }
    }

    const treatments = [...(animal.treatments||[])].sort((a,b) => (b.date||"").localeCompare(a.date||""))
      .map(t => [fmtDate(t.date), t.type || "Sonstiges", t.desc || "", t.next ? fmtDate(t.next) : "\u2014"]);
    addSection("Behandlungsverlauf", ["Datum", "Art", "Beschreibung", "N\u00e4chster Termin"], treatments, "Keine Behandlungen eingetragen.");

    const stools = [...(animal.stoolSamples||[])].sort((a,b) => (b.date||"").localeCompare(a.date||""))
      .map(s => [fmtDate(s.date), s.result || "", s.next ? fmtDate(s.next) : "\u2014", s.next ? (s.nextDone ? "ja" : "nein") : "\u2014"]);
    addSection("Kotproben", ["Datum", "Befund", "N\u00e4chste Probe", "Erledigt"], stools, "Keine Kotproben eingetragen.");

    const weights = [...(animal.weights||[])].sort((a,b) => (b.date||"").localeCompare(a.date||""))
      .map(w => [fmtDate(w.date), w.weight + " kg", w.notes || ""]);
    addSection("Gewichtsverlauf", ["Datum", "Gewicht", "Notizen"], weights, "Keine Gewichte eingetragen.");

    const docs = (animal.documents||[]).map(d => [d.filename, fmtDate(d.dateAdded), formatBytes(d.size)]);
    addSection("Dateien", ["Dateiname", "Hinzugef\u00fcgt am", "Gr\u00f6\u00dfe"], docs, "Keine Dateien hochgeladen.");
    if(docs.length){
      doc.setFont("helvetica", "italic");
      doc.setFontSize(8.5);
      doc.text("Hinweis: die Dateiinhalte selbst sind in diesem PDF nicht enthalten, nur die Liste der Dateinamen.", 14, y);
      y += 8;
    }

    doc.setFont("helvetica", "normal");
    doc.setFontSize(8);
    doc.setTextColor(150);
    const today = new Date().toISOString().slice(0,10);
    doc.text(`Erstellt am ${fmtDate(today)} \u2013 Mythen Alpaka Tierkartei`, 14, doc.internal.pageSize.getHeight() - 10);

    const safeName = (animal.name || "tier").replace(/[^a-z0-9\-_]+/gi, "_");
    const suggestedName = `${safeName}-export-${today}.pdf`;
    let filename = window.prompt("Dateiname f\u00fcr den PDF-Export:", suggestedName);
    if(filename === null) return;
    filename = filename.trim() || suggestedName;
    if(!filename.toLowerCase().endsWith(".pdf")) filename += ".pdf";
    doc.save(filename);
  }

  async function load(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){ state = JSON.parse(raw); }
      statusEl.textContent = "gespeichert (lokal)";
    }catch(e){
      state = { animals: [], pastures: [], selectedId: null };
      statusEl.textContent = "neue Kartei";
    }
    if(!state.animals) state.animals = [];
    if(!state.pastures) state.pastures = [];
    if(!state.shearings) state.shearings = [];
    if(!state.hooves) state.hooves = [];
    if(!state.costs) state.costs = [];
    state.animals.forEach(a => {
      if(!a.treatments) a.treatments = [];
      if(!a.weights) a.weights = [];
      if(!a.documents) a.documents = [];
      if(!a.stoolSamples) a.stoolSamples = [];
    });
    if(state.animals.length && !state.selectedId){ state.selectedId = state.animals[0].id; }
    view = state.animals.length ? "dashboard" : "pasture";
    render();
  }

      statusEl.textContent = "speichern fehlgeschlagen (Speicher voll?)";

    }
  }

  function getSelected(){ return state.animals.find(a => a.id === state.selectedId) || null; }

  function render(){
    renderTabs();
    if(showingAnimalForm){ renderAnimal(); return; }
    if(view === "dashboard"){ renderDashboard(); }
    else if(view === "pasture"){ renderPasture(); }
    else if(view === "shearing"){ renderSimpleLog("shearings", "Schur"); }
    else if(view === "hooves"){ renderSimpleLog("hooves", "Klauenpflege"); }
    else if(view === "costs"){ renderCosts(); }
    else { renderAnimal(); }
  }

  function resetRegisterState(){
    addingPasture = false; editingPastureId = null;
    addingLog = { shearings: false, hooves: false };

  }

  // ---------- Weidemanagement ----------
  function renderPasture(){
    contentEl.innerHTML = "";
    const head = document.createElement("div");
    head.className = "record-head";
    head.innerHTML = `<div><h2>Weidemanagement</h2></div>`;
    contentEl.appendChild(head);

    const sorted = [...state.pastures].sort((a,b) => (b.start||"").localeCompare(a.start||""));
    const current = sorted[0] || null;

    if(current){
      if(editingPastureId === current.id){
        contentEl.appendChild(buildPastureForm(current));
      } else {
        const dueDate = addDays(current.start, PASTURE_ROTATION_DAYS);
        const overdue = isOverdue(dueDate);
        if(overdue){
          const banner = document.createElement("div");
          banner.className = "banner-warning";
          banner.textContent = "Weidewechsel f\u00e4llig \u2014 die aktuelle Weide wird bereits seit \u00fcber 4 Wochen genutzt.";
          contentEl.appendChild(banner);
        }
        const cur = document.createElement("div");
        cur.className = "pasture-current" + (overdue ? " overdue" : "");
        cur.innerHTML = `
          <div><div class="meta">Aktuelle Weide</div><div class="name">${escapeHtml(current.name || "(ohne Namen)")}</div></div>
          <div>
            <div class="meta">seit ${escapeHtml(fmtDate(current.start))}</div>
            <div class="meta due">${overdue ? "Wechsel f\u00e4llig seit " + escapeHtml(fmtDate(dueDate)) : "n\u00e4chster Wechsel: " + escapeHtml(fmtDate(dueDate))}</div>
          </div>`;
        const editBtn = document.createElement("button");
        editBtn.className = "icon-btn";
        editBtn.textContent = "Bearbeiten";
        editBtn.onclick = () => { editingPastureId = current.id; render(); };
        cur.appendChild(editBtn);
        contentEl.appendChild(cur);
      }
    } else {
      contentEl.appendChild(noEntries("Noch keine Weide eingetragen."));
    }

    contentEl.appendChild(sectionTitleEl("Verlauf"));
    const list = document.createElement("div");
    list.className = "log-list";
    if(sorted.length === 0){ list.appendChild(noEntries("Noch keine weiteren Eintr\u00e4ge.")); }
    sorted.slice(1).forEach(p => {
      if(editingPastureId === p.id){
        list.appendChild(buildPastureForm(p));
        return;
      }
      const row = document.createElement("div");
      row.className = "log-row pasture";
      row.innerHTML = `
        <div class="date">${escapeHtml(fmtDate(p.start))}</div>
        <div class="desc">${escapeHtml(p.name || "")}${p.notes ? " \u2014 " + escapeHtml(p.notes) : ""}</div>
        <div class="next">bis ${escapeHtml(fmtDate(addDays(p.start, PASTURE_ROTATION_DAYS)))}</div>`;
      const editBtn = document.createElement("button");
      editBtn.className = "view-link";
      editBtn.textContent = "Bearbeiten";
      editBtn.onclick = () => { editingPastureId = p.id; render(); };
      row.appendChild(editBtn);
      const delBtn = document.createElement("button");
      delBtn.className = "del"; delBtn.innerHTML = "&times;"; delBtn.title = "L\u00f6schen";
      delBtn.onclick = () => { state.pastures = state.pastures.filter(x => x.id !== p.id); save(); render(); };
      row.appendChild(delBtn);
      list.appendChild(row);
    });
    contentEl.appendChild(list);

    if(addingPasture){ contentEl.appendChild(buildPastureForm()); }
    else { contentEl.appendChild(toggleBtn("+ Weide eintragen / wechseln", () => { addingPasture = true; render(); })); }
  }

  // ---------- Dashboard ----------
  function renderDashboard(){
    contentEl.innerHTML = "";
    const head = document.createElement("div");
    head.className = "record-head";
    head.innerHTML = `<div><h2>Dashboard</h2></div>`;
    contentEl.appendChild(head);

    if(state.animals.length === 0){
      contentEl.appendChild(noEntries("Noch keine Tiere erfasst."));
      return;
    }

    const grid = document.createElement("div");
    grid.className = "dashboard-grid";

    state.animals.forEach(animal => {
      const card = document.createElement("div");
      card.className = "dashboard-card";

      const latestWeight = [...(animal.weights||[])].sort((a,b) => (b.date||"").localeCompare(a.date||""))[0];
      const nextStool = [...(animal.stoolSamples||[])]
        .filter(s => s.next && !s.nextDone)
        .sort((a,b) => (b.date||"").localeCompare(a.date||""))[0];
      const lastTreatments = [...(animal.treatments||[])].sort((a,b) => (b.date||"").localeCompare(a.date||"")).slice(0,3);

      const photoHtml = animal.photo
        ? `<img class="animal-photo" src="${animal.photo}" alt="" />`
        : `<div class="animal-photo-placeholder">${escapeHtml((animal.name || "?").charAt(0).toUpperCase())}</div>`;

      let stoolHtml;
      if(nextStool){
        const overdue = isOverdue(nextStool.next);
        stoolHtml = `<span class="${overdue ? "next due" : "next"}">${escapeHtml(fmtDate(nextStool.next))}${overdue ? " (f\u00e4llig)" : ""}</span>`;
      } else {
        stoolHtml = `<span class="dashboard-muted">keine offene Probe</span>`;
      }

      let treatmentsHtml;
      if(lastTreatments.length === 0){
        treatmentsHtml = `<div class="dashboard-muted">keine Eintr\u00e4ge</div>`;
      } else {
        treatmentsHtml = lastTreatments.map(t =>
          `<div class="dashboard-treatment-line"><span class="date">${escapeHtml(fmtDate(t.date))}</span> ${escapeHtml(t.type || "")}${t.desc ? " \u2013 " + escapeHtml(t.desc) : ""}</div>`
        ).join("");
      }

      card.innerHTML = `
        <div class="dashboard-card-head">
          ${photoHtml}
          <div>
            <div class="dashboard-name">${escapeHtml(animal.name || "(ohne Namen)")}</div>
            <span class="species-badge">${escapeHtml(animal.species || "")}</span>
          </div>
        </div>
        <div class="dashboard-row"><label>Aktuelles Gewicht</label><div>${latestWeight ? escapeHtml(latestWeight.weight + " kg (" + fmtDate(latestWeight.date) + ")") : '<span class="dashboard-muted">keine Angabe</span>'}</div></div>
        <div class="dashboard-row"><label>N\u00e4chste Kotprobe</label><div>${stoolHtml}</div></div>
        <div class="dashboard-row"><label>Letzte Behandlungen</label>${treatmentsHtml}</div>
      `;
      const openBtn = document.createElement("button");
      openBtn.className = "btn secondary";
      openBtn.textContent = "Tier \u00f6ffnen";
      openBtn.style.marginTop = "8px";
      openBtn.onclick = () => {
        view = "animal"; state.selectedId = animal.id;
        resetRegisterState(); render();
      };
      card.appendChild(openBtn);

      grid.appendChild(card);
    });

    contentEl.appendChild(grid);
  }

  // ---------- Einfache Register (Schur, Klauen) ----------

    contentEl.appendChild(head);

    const list = document.createElement("div");
    list.className = "log-list";
    const sorted = [...state[category]].sort((a,b) => (b.date||"").localeCompare(a.date||""));

    sorted.forEach(item => {
      if(editingLogId[category] === item.id){
        list.appendChild(buildSimpleLogForm(category, item));
        return;
      }
      const row = document.createElement("div");
      row.className = "log-row simplelog";
      row.innerHTML = `
        <div class="date">${escapeHtml(fmtDate(item.date))}</div>

  // ---------- Kosten ----------
  function formatCHF(amount){
    const n = Number(amount) || 0;
    return "CHF " + n.toLocaleString("de-CH", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function renderCosts(){
    contentEl.innerHTML = "";
    const head = document.createElement("div");
    head.className = "record-head";
    head.innerHTML = `<div><h2>Kosten</h2></div>`;
    contentEl.appendChild(head);

    const costs = state.costs || [];
    const years = {};
    costs.forEach(c => {
      const year = (c.date || "").slice(0,4) || "?";
      if(!years[year]) years[year] = { income: 0, expense: 0 };
      const amt = Number(c.amount) || 0;
      if(c.type === "einnahme"){ years[year].income += amt; } else { years[year].expense += amt; }
    });
    const yearKeys = Object.keys(years).sort((a,b) => b.localeCompare(a));

    if(yearKeys.length){
      const summary = document.createElement("div");
      summary.className = "cost-summary";
      yearKeys.forEach(year => {
        const y = years[year];
        const balance = y.income - y.expense;
        const box = document.createElement("div");
        box.className = "cost-summary-box";
        box.innerHTML = `
          <div class="cost-summary-year">${escapeHtml(year)}</div>
          <div class="cost-summary-row"><span>Einnahmen</span><span class="cost-in">${escapeHtml(formatCHF(y.income))}</span></div>
          <div class="cost-summary-row"><span>Ausgaben</span><span class="cost-out">${escapeHtml(formatCHF(y.expense))}</span></div>
          <div class="cost-summary-row cost-balance"><span>Saldo</span><span class="${balance >= 0 ? "cost-in" : "cost-out"}">${escapeHtml(formatCHF(balance))}</span></div>
        `;
        summary.appendChild(box);
      });
      contentEl.appendChild(summary);
    } else {
      contentEl.appendChild(noEntries("Noch keine Kosten eingetragen."));
    }

    contentEl.appendChild(sectionTitleEl("Alle Eintr\u00e4ge"));
    const list = document.createElement("div");
    list.className = "log-list";
    const sorted = [...costs].sort((a,b) => (b.date||"").localeCompare(a.date||""));
    if(sorted.length === 0){ list.appendChild(noEntries("Noch keine Eintr\u00e4ge.")); }
    sorted.forEach(c => {
      if(editingCostId === c.id){
        list.appendChild(buildCostForm(c));
        return;
      }
      const row = document.createElement("div");
      row.className = "log-row cost";
      const typeLabel = c.type === "einnahme" ? "Einnahme" : "Ausgabe";
      const typeColor = c.type === "einnahme" ? "#4C6650" : "#A6482F";
      row.innerHTML = `
        <div class="date">${escapeHtml(fmtDate(c.date))}</div>
        <div class="type" style="background:${typeColor}">${escapeHtml(typeLabel)}</div>
        <div class="desc">${escapeHtml(c.description || "")}</div>
        <div class="${c.type === "einnahme" ? "cost-in" : "cost-out"}">${escapeHtml(formatCHF(c.amount))}</div>`;
      const editBtn = document.createElement("button");
      editBtn.className = "view-link"; editBtn.textContent = "Bearbeiten";
      editBtn.onclick = () => { editingCostId = c.id; render(); };
      row.appendChild(editBtn);
      const delBtn = document.createElement("button");
      delBtn.className = "del"; delBtn.innerHTML = "&times;"; delBtn.title = "L\u00f6schen";
      delBtn.onclick = () => { state.costs = state.costs.filter(x => x.id !== c.id); save(); render(); };
      row.appendChild(delBtn);
      list.appendChild(row);
    });
    contentEl.appendChild(list);

    if(addingCost){ contentEl.appendChild(buildCostForm()); }
    else { contentEl.appendChild(toggleBtn("+ Eintrag hinzuf\u00fcgen", () => { addingCost = true; render(); })); }
  }

  // ---------- Tier-Ansicht ----------
  function renderAnimal(){
    contentEl.innerHTML = "";
    if(showingAnimalForm){ contentEl.appendChild(buildAnimalForm()); return; }

    const animal = getSelected();
    if(!animal){
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.innerHTML = `<h2>Noch keine Tiere erfasst</h2><p>Lege dein erstes Tier an, um Behandlungen zu dokumentieren.</p>`;
      const btn = document.createElement("button");
      btn.className = "btn amber"; btn.textContent = "Erstes Tier anlegen";
      btn.onclick = () => { showingAnimalForm = true; render(); };
      empty.appendChild(btn);
      contentEl.appendChild(empty);
      return;
    }

    const head = document.createElement("div");
    head.className = "record-head";
    const photoHtml = animal.photo
      ? `<img class="animal-photo" src="${animal.photo}" alt="Foto von ${escapeAttr(animal.name)}" />`
      : `<div class="animal-photo-placeholder">${escapeHtml((animal.name || "?").charAt(0).toUpperCase())}</div>`;
    head.innerHTML = `
      <div class="record-head-info">
        ${photoHtml}
        <div>
          <h2>${escapeHtml(animal.name || "(ohne Namen)")}</h2>
          <span class="species-badge">${escapeHtml(animal.species || "Art unbekannt")}</span>
        </div>
      </div>`;
    const delBtn = document.createElement("button");
    delBtn.className = "icon-btn"; delBtn.textContent = "Tier l\u00f6schen";
    delBtn.onclick = () => {
      if(confirm(`"${animal.name}" inklusive aller Eintr\u00e4ge wirklich l\u00f6schen?`)){
        (animal.documents || []).forEach(d => { idbDelete(`tierkartei-doc-${d.id}`).catch(()=>{}); });
        state.animals = state.animals.filter(a => a.id !== animal.id);
        state.selectedId = state.animals.length ? state.animals[0].id : null;
        save(); render();
      }
    };
    const editBtn = document.createElement("button");
    editBtn.className = "icon-btn";
    editBtn.textContent = editingAnimalId === animal.id ? "Abbrechen" : "Stammdaten bearbeiten";
    editBtn.style.marginRight = "8px";
    editBtn.onclick = () => { editingAnimalId = editingAnimalId === animal.id ? null : animal.id; render(); };
    const exportAnimalBtn = document.createElement("button");
    exportAnimalBtn.className = "icon-btn";
    exportAnimalBtn.textContent = "Tier exportieren";
    exportAnimalBtn.style.marginRight = "8px";
    exportAnimalBtn.onclick = () => {
      const originalLabel = exportAnimalBtn.textContent;
      exportAnimalBtn.textContent = "erstelle PDF \u2026";
      exportAnimalBtn.disabled = true;
      try{
        buildAnimalPdf(animal);
      }catch(e){
        console.error(e);
        alert("PDF konnte nicht erstellt werden.");
      } finally {
        exportAnimalBtn.textContent = originalLabel;
        exportAnimalBtn.disabled = false;
      }
    };
    head.appendChild(editBtn);
    head.appendChild(exportAnimalBtn);
    head.appendChild(delBtn);
    contentEl.appendChild(head);

    const latestWeight = [...(animal.weights||[])].sort((a,b) => (b.date||"").localeCompare(a.date||""))[0];
    const nextStool = [...(animal.stoolSamples||[])]
      .filter(s => s.next && !s.nextDone)
      .sort((a,b) => (b.date||"").localeCompare(a.date||""))[0];

    if(editingAnimalId === animal.id){
      contentEl.appendChild(buildAnimalEditForm(animal));
    } else {
      const metaGrid = document.createElement("div");
      metaGrid.className = "meta-grid";
      metaGrid.appendChild(metaField("Rasse", animal.breed));
      metaGrid.appendChild(metaField("Geburtsdatum", animal.birthdate ? fmtDate(animal.birthdate) : ""));
      metaGrid.appendChild(metaField("Aktuelles Gewicht", latestWeight ? latestWeight.weight + " kg (" + fmtDate(latestWeight.date) + ")" : ""));
      metaGrid.appendChild(metaField("Notizen", animal.notes));
      contentEl.appendChild(metaGrid);
    }

    if(nextStool && isOverdue(nextStool.next)){
      const banner = document.createElement("div");
      banner.className = "banner-warning";
      banner.textContent = "N\u00e4chste Kotprobe f\u00fcr " + (animal.name || "dieses Tier") + " ist f\u00e4llig (" + fmtDate(nextStool.next) + ").";
      contentEl.appendChild(banner);
    }

    // Behandlungen
    contentEl.appendChild(sectionTitleEl("Behandlungsverlauf"));
    const filterBar = document.createElement("div");
    filterBar.className = "treatment-filter";
    const filterOptionsHtml = `<option value="alle" ${treatmentFilter === "alle" ? "selected" : ""}>Alle Kategorien</option>`
      + TREATMENT_TYPES.map(t => `<option value="${t}" ${treatmentFilter === t ? "selected" : ""}>${t}</option>`).join("");
    filterBar.innerHTML = `<label class="f-label">Filter nach Kategorie</label><select id="tk-treatment-filter">${filterOptionsHtml}</select>`;
    contentEl.appendChild(filterBar);
    filterBar.querySelector("#tk-treatment-filter").onchange = (e) => { treatmentFilter = e.target.value; render(); };

    const tList = document.createElement("div"); tList.className = "log-list";
    const tAll = [...(animal.treatments || [])].sort((a,b) => (b.date||"").localeCompare(a.date||""));
    const tFiltered = treatmentFilter === "alle" ? tAll : tAll.filter(t => (t.type || "Sonstiges") === treatmentFilter);
    const tSortedAll = tFiltered;
    const tSorted = showAllTreatments ? tSortedAll : tSortedAll.slice(0, 10);
    if(tSorted.length === 0){ tList.appendChild(noEntries(treatmentFilter === "alle" ? "Noch keine Behandlungen eingetragen." : "Keine Eintr\u00e4ge in dieser Kategorie.")); }
    else {
      tSorted.forEach(t => {
        if(editingTreatmentId === t.id){
          tList.appendChild(buildTreatmentForm(animal, t));
          return;
        }
        const row = document.createElement("div"); row.className = "log-row treatment";
        const nextClass = t.next && isOverdue(t.next) ? "next due" : "next";
        const typeColor = TREATMENT_COLORS[t.type] || TREATMENT_COLORS["Sonstiges"];
        row.innerHTML = `
          <div class="date">${escapeHtml(fmtDate(t.date))}</div>
          <div class="type" style="background:${typeColor}">${escapeHtml(t.type || "Sonstiges")}</div>
          <div class="desc">${escapeHtml(t.desc || "")}</div>
          <div class="${nextClass}">${t.next ? "n\u00e4chster: " + escapeHtml(fmtDate(t.next)) : ""}</div>`;
        const editBtn = document.createElement("button");
        editBtn.className = "view-link"; editBtn.textContent = "Bearbeiten";
        editBtn.onclick = () => { editingTreatmentId = t.id; render(); };
        row.appendChild(editBtn);
        const del = document.createElement("button");
        del.className = "del"; del.innerHTML = "&times;"; del.title = "L\u00f6schen";
        del.onclick = () => { animal.treatments = animal.treatments.filter(x => x.id !== t.id); save(); render(); };
        row.appendChild(del); tList.appendChild(row);
      });
    }
    contentEl.appendChild(tList);
    if(tSortedAll.length > 10){
      const toggleAllBtn = document.createElement("button");
      toggleAllBtn.className = "toggle-add";
      toggleAllBtn.textContent = showAllTreatments ? "Nur letzte 10 anzeigen" : `Gesamten Verlauf anzeigen (${tSortedAll.length})`;
      toggleAllBtn.onclick = () => { showAllTreatments = !showAllTreatments; render(); };
      contentEl.appendChild(toggleAllBtn);
    }
    if(addingTreatmentFor === animal.id){ contentEl.appendChild(buildTreatmentForm(animal)); }
    else { contentEl.appendChild(toggleBtn("+ Behandlung eintragen", () => { addingTreatmentFor = animal.id; render(); })); }

    // Kotproben
    contentEl.appendChild(sectionTitleEl("Kotproben"));
    const sList = document.createElement("div"); sList.className = "log-list";
    const sSorted = [...(animal.stoolSamples || [])].sort((a,b) => (b.date||"").localeCompare(a.date||""));
    if(sSorted.length === 0){ sList.appendChild(noEntries("Noch keine Kotproben eingetragen.")); }
    else {
      sSorted.forEach(s => {
        if(editingStoolId === s.id){
          sList.appendChild(buildStoolForm(animal, s));
          return;
        }
        const row = document.createElement("div"); row.className = "log-row stool";
        const isDue = s.next && isOverdue(s.next) && !s.nextDone;
        const nextClass = isDue ? "next due" : "next";
        const nextText = s.next
          ? (s.nextDone ? "erledigt (war " + escapeHtml(fmtDate(s.next)) + ")" : escapeHtml(fmtDate(s.next)))
          : "\u2014";
        row.innerHTML = `
          <div class="date">${escapeHtml(fmtDate(s.date))}</div>
          <div class="desc">${escapeHtml(s.result || "")}</div>`;
        const nextCell = document.createElement("div");
        nextCell.className = "stool-next-cell";
        const nextTextEl = document.createElement("div");
        nextTextEl.className = nextClass;
        nextTextEl.textContent = nextText;
        nextCell.appendChild(nextTextEl);
        if(s.next){
          const label = document.createElement("label");
          label.className = "done-check";
          const cb = document.createElement("input");
          cb.type = "checkbox";
          cb.checked = !!s.nextDone;
          cb.onchange = () => { s.nextDone = cb.checked; save(); render(); };
          label.appendChild(cb);
          label.appendChild(document.createTextNode("erledigt"));
          nextCell.appendChild(label);
        }
        row.appendChild(nextCell);
        const editBtn = document.createElement("button");
        editBtn.className = "view-link"; editBtn.textContent = "Bearbeiten";
        editBtn.onclick = () => { editingStoolId = s.id; render(); };
        row.appendChild(editBtn);
        const del = document.createElement("button");
        del.className = "del"; del.innerHTML = "&times;"; del.title = "L\u00f6schen";
        del.onclick = () => { animal.stoolSamples = animal.stoolSamples.filter(x => x.id !== s.id); save(); render(); };
        row.appendChild(del); sList.appendChild(row);
      });
    }
    contentEl.appendChild(sList);
    if(addingStoolFor === animal.id){ contentEl.appendChild(buildStoolForm(animal)); }
    else { contentEl.appendChild(toggleBtn("+ Kotprobe eintragen", () => { addingStoolFor = animal.id; render(); })); }

    // Gewicht
    contentEl.appendChild(sectionTitleEl("Gewichtsverlauf"));
    const wList = document.createElement("div"); wList.className = "log-list";
    const wSorted = [...(animal.weights || [])].sort((a,b) => (b.date||"").localeCompare(a.date||""));
    if(wSorted.length === 0){ wList.appendChild(noEntries("Noch keine Gewichte eingetragen.")); }
    else {
      wSorted.forEach(w => {
        const row = document.createElement("div"); row.className = "log-row weight";
        row.innerHTML = `
          <div class="date">${escapeHtml(fmtDate(w.date))}</div>
          <div class="weight-val">${escapeHtml(String(w.weight))} kg</div>
          <div class="desc">${escapeHtml(w.notes || "")}</div>`;
        const del = document.createElement("button");
        del.className = "del"; del.innerHTML = "&times;"; del.title = "L\u00f6schen";
        del.onclick = () => { animal.weights = animal.weights.filter(x => x.id !== w.id); save(); render(); };
        row.appendChild(del); wList.appendChild(row);
      });
    }
    contentEl.appendChild(wList);
    if(addingWeightFor === animal.id){ contentEl.appendChild(buildWeightForm(animal)); }
    else { contentEl.appendChild(toggleBtn("+ Gewicht eintragen", () => { addingWeightFor = animal.id; render(); })); }

    // Dateien
    contentEl.appendChild(sectionTitleEl("Dokumentenablage"));
    const docs = animal.documents || [];
    const activeDocs = docs.filter(d => !d.archived);
    const archivedDocs = docs.filter(d => d.archived);

    function buildDocRow(d){
      const row = document.createElement("div"); row.className = "log-row doc";
      row.innerHTML = `
        <div class="filename">${escapeHtml(d.filename)}</div>
        <div class="filemeta">${escapeHtml(fmtDate(d.dateAdded))} \u00b7 ${escapeHtml(formatBytes(d.size))}</div>`;
      const viewBtn = document.createElement("button");
      viewBtn.className = "view-link"; viewBtn.textContent = "\u00d6ffnen";
      viewBtn.onclick = () => {
        viewBtn.textContent = "l\u00e4dt \u2026";
        const w = window.open("", "_blank");
        (async () => {
          try{
            const raw = await idbGet(`tierkartei-doc-${d.id}`);
            if(raw && w){
              const blob = dataURLtoBlob(raw);
              const blobUrl = URL.createObjectURL(blob);
              w.location.href = blobUrl;
            } else if(w){
              w.close();
              alert("Datei konnte nicht geladen werden.");
            }
          }catch(e){
            if(w) w.close();
            alert("Datei konnte nicht geladen werden.");
          }
          viewBtn.textContent = "\u00d6ffnen";
        })();
      };
      row.appendChild(viewBtn);
      const renameBtn = document.createElement("button");
      renameBtn.className = "view-link";
      renameBtn.textContent = "Umbenennen";
      renameBtn.onclick = () => {
        const newName = window.prompt("Neuer Dateiname:", d.filename);
        if(newName === null) return;
        const trimmed = newName.trim();
        if(trimmed){ d.filename = trimmed; save(); render(); }
      };
      row.appendChild(renameBtn);
      const archiveBtn = document.createElement("button");
      archiveBtn.className = "view-link";
      archiveBtn.textContent = d.archived ? "Aus Archiv holen" : "Archivieren";
      archiveBtn.onclick = () => { d.archived = !d.archived; save(); render(); };
      row.appendChild(archiveBtn);
      const del = document.createElement("button");
      del.className = "del"; del.innerHTML = "&times;"; del.title = "L\u00f6schen";
      del.onclick = () => {
        idbDelete(`tierkartei-doc-${d.id}`).catch(()=>{});
        animal.documents = animal.documents.filter(x => x.id !== d.id);
        save(); render();
      };
      row.appendChild(del);
      return row;
    }

    const dList = document.createElement("div"); dList.className = "log-list";
    if(activeDocs.length === 0){
      dList.appendChild(noEntries(archivedDocs.length ? "Keine aktiven Dateien \u2013 alle im Archiv." : "Noch keine Dateien hochgeladen."));
    } else {
      activeDocs.forEach(d => dList.appendChild(buildDocRow(d)));
    }
    contentEl.appendChild(dList);

    if(archivedDocs.length){
      const archiveToggle = document.createElement("button");
      archiveToggle.className = "toggle-add";
      archiveToggle.textContent = showArchive ? "Archiv verbergen" : `Archiv anzeigen (${archivedDocs.length})`;
      archiveToggle.onclick = () => { showArchive = !showArchive; render(); };
      contentEl.appendChild(archiveToggle);
      if(showArchive){
        const archiveList = document.createElement("div"); archiveList.className = "log-list";
        archivedDocs.forEach(d => archiveList.appendChild(buildDocRow(d)));
        contentEl.appendChild(archiveList);
      }
    }

    if(addingDocFor === animal.id){ contentEl.appendChild(buildDocForm(animal)); }
    else { contentEl.appendChild(toggleBtn("+ Datei hochladen", () => { addingDocFor = animal.id; render(); })); }
  }

  function sectionTitleEl(title){
    const el = document.createElement("div"); el.className = "section-title";
    el.innerHTML = `<h3>${escapeHtml(title)}</h3><div class="rule"></div>`;
    return el;
  }
  function noEntries(text){ const el = document.createElement("div"); el.className = "no-entries"; el.textContent = text; return el; }
  function toggleBtn(label, onClick){
    const btn = document.createElement("button"); btn.className = "toggle-add"; btn.textContent = label; btn.onclick = onClick; return btn;
  }
  function metaField(label, value){
    const div = document.createElement("div"); div.className = "meta-field";
    div.innerHTML = `<label>${escapeHtml(label)}</label><div class="val${value ? "" : " empty-val"}">${escapeHtml(value || "\u2014")}</div>`;
    return div;
  }

  function buildAnimalForm(){
    const form = document.createElement("form");
    form.className = "inline-form";
    form.innerHTML = `
      <div class="form-row full">
        <div><label class="f-label">Foto (optional)</label><input type="file" name="photo" accept="image/*" /></div>
      </div>
      <div class="form-row">
        <div><label class="f-label">Name</label><input type="text" name="name" required placeholder="z.B. Bella" /></div>
        <div><label class="f-label">Tierart</label><select name="species"><option value="Alpaka" selected>Alpaka</option></select></div>
      </div>
      <div class="form-row">
        <div><label class="f-label">Rasse</label><input type="text" name="breed" placeholder="optional" /></div>
        <div><label class="f-label">Geburtsdatum</label><input type="date" name="birthdate" /></div>
      </div>
      <div class="form-row full"><div><label class="f-label">Notizen</label><textarea name="notes" placeholder="Besonderheiten, Futter, Charakter, ..."></textarea></div></div>
      <div class="btn-row">
        <button type="submit" class="btn">Tier speichern</button>
        <button type="button" class="btn secondary" id="tk-cancel-animal">Abbrechen</button>
      </div>`;
    const photoInput = form.querySelector('input[name="photo"]');
    form.onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData(form);
      let photo = null;
      const file = photoInput.files[0];
      if(file){
        try{ photo = await resizeImageToDataUrl(file, 500, 0.82); }catch(e){ photo = null; }
      }
      const newAnimal = {
        id: uid(), name: fd.get("name").trim(), species: fd.get("species").trim(),
        breed: fd.get("breed").trim(), birthdate: fd.get("birthdate"), notes: fd.get("notes").trim(),
        photo, treatments: [], weights: [], documents: [], stoolSamples: []
      };
      state.animals.push(newAnimal);
      state.selectedId = newAnimal.id;
      view = "animal"; showingAnimalForm = false;
      save(); render();
    };
    form.querySelector("#tk-cancel-animal").onclick = () => { showingAnimalForm = false; render(); };
    return form;
  }

  function buildAnimalEditForm(animal){
    const form = document.createElement("form");
    form.className = "inline-form";
    const photoPreviewHtml = animal.photo
      ? `<img class="animal-photo" src="${animal.photo}" alt="" />`
      : `<div class="animal-photo-placeholder">${escapeHtml((animal.name || "?").charAt(0).toUpperCase())}</div>`;
    form.innerHTML = `
      <div class="photo-edit-row">
        <div id="tk-photo-preview">${photoPreviewHtml}</div>
        <div class="photo-edit-controls">
          <label class="f-label">Foto (optional)</label>
          <input type="file" name="photo" accept="image/*" />
          ${animal.photo ? `<label class="remove-photo-check"><input type="checkbox" name="removePhoto" /> aktuelles Foto entfernen</label>` : ""}
        </div>
      </div>
      <div class="form-row">
        <div><label class="f-label">Name</label><input type="text" name="name" required value="${escapeAttr(animal.name)}" /></div>
        <div><label class="f-label">Tierart</label><select name="species"><option value="Alpaka" selected>Alpaka</option></select></div>
      </div>
      <div class="form-row">
        <div><label class="f-label">Rasse</label><input type="text" name="breed" value="${escapeAttr(animal.breed)}" /></div>
        <div><label class="f-label">Geburtsdatum</label><input type="date" name="birthdate" value="${escapeAttr(animal.birthdate)}" /></div>
      </div>
      <div class="form-row full"><div><label class="f-label">Notizen</label><textarea name="notes">${escapeHtml(animal.notes)}</textarea></div></div>
      <div class="btn-row">
        <button type="submit" class="btn">Speichern</button>
        <button type="button" class="btn secondary" id="tk-cancel-edit">Abbrechen</button>
      </div>`;
    const photoInput = form.querySelector('input[name="photo"]');
    const photoPreview = form.querySelector('#tk-photo-preview');
    photoInput.onchange = async () => {
      const file = photoInput.files[0];
      if(!file) return;
      try{
        const dataUrl = await resizeImageToDataUrl(file, 500, 0.82);
        photoPreview.innerHTML = `<img class="animal-photo" src="${dataUrl}" alt="" />`;
        photoInput.dataset.pendingPhoto = dataUrl;
      }catch(e){ alert("Foto konnte nicht verarbeitet werden."); }
    };
    form.onsubmit = (e) => {
      e.preventDefault();
      const fd = new FormData(form);
      animal.name = fd.get("name").trim();
      animal.species = fd.get("species").trim();
      animal.breed = fd.get("breed").trim();
      animal.birthdate = fd.get("birthdate");
      animal.notes = fd.get("notes").trim();
      if(photoInput.dataset.pendingPhoto){
        animal.photo = photoInput.dataset.pendingPhoto;
      } else if(fd.get("removePhoto")){
        animal.photo = null;
      }
      editingAnimalId = null;
      save(); render();
    };
    form.querySelector("#tk-cancel-edit").onclick = () => { editingAnimalId = null; render(); };
    return form;
  }

  function buildTreatmentForm(animal, existing){

    form.innerHTML = `
      <div class="form-row three">
        <div><label class="f-label">Datum</label><input type="date" name="date" required value="${existing ? escapeAttr(existing.date) : ""}" /></div>
        <div><label class="f-label">Art</label><select name="type">${options}</select></div>
        <div><label class="f-label">N\u00e4chster Termin</label><input type="date" name="next" value="${existing ? escapeAttr(existing.next) : ""}" /></div>
      </div>
      <div class="form-row full"><div><label class="f-label">Beschreibung</label><input type="text" name="desc" placeholder="z.B. Tollwutimpfung, Zeckenmittel, ..." value="${existing ? escapeAttr(existing.desc) : ""}" /></div></div>
      <div class="btn-row">
        <button type="submit" class="btn">${existing ? "Speichern" : "Eintragen"}</button>

        existing.desc = fd.get("desc").trim();

        addingTreatmentFor = null;
      }

    };
    form.querySelector("#tk-cancel-treatment").onclick = () => {
      if(existing){ editingTreatmentId = null; } else { addingTreatmentFor = null; }
      render();
    };

  }

  function buildDocForm(animal){
    const form = document.createElement("form");
    form.className = "inline-form";
    form.innerHTML = `
      <div class="form-row full"><div><label class="f-label">Datei (PDF oder Bild, max. ${formatBytes(MAX_DOC_BYTES)})</label>
      <input type="file" name="file" accept="application/pdf,image/*" required /></div></div>
      <div class="hint" id="tk-doc-hint"></div>
      <div class="btn-row">
        <button type="submit" class="btn">Hochladen</button>
        <button type="button" class="btn secondary" id="tk-cancel-doc">Abbrechen</button>
      </div>`;
    form.onsubmit = (e) => {
      e.preventDefault();
      const fileInput = form.querySelector('input[name="file"]');
      const file = fileInput.files[0];
      const hint = form.querySelector("#tk-doc-hint");
      if(!file) return;
      if(file.size > MAX_DOC_BYTES){
        hint.textContent = "Diese Datei ist zu gro\u00df (" + formatBytes(file.size) + "). Bitte eine kleinere Datei w\u00e4hlen.";
        hint.style.color = "var(--clay)";
        return;
      }
      const reader = new FileReader();
      reader.onload = async () => {
        const docId = uid();
        try{
          hint.textContent = "l\u00e4dt hoch \u2026"; hint.style.color = "";
          await idbSet(`tierkartei-doc-${docId}`, reader.result);
          if(!animal.documents) animal.documents = [];
          animal.documents.push({ id: docId, filename: file.name, mimetype: file.type || "application/octet-stream", size: file.size, dateAdded: new Date().toISOString().slice(0,10), archived: false });
          addingDocFor = null;
          save(); render();
        }catch(err){
          hint.textContent = "Hochladen fehlgeschlagen. Bitte erneut versuchen.";
          hint.style.color = "var(--clay)";
        }
      };
      reader.readAsDataURL(file);
    };
    form.querySelector("#tk-cancel-doc").onclick = () => { addingDocFor = null; render(); };
    return form;
  }

  function setupDataActions(){
    const exportBtn = document.getElementById('tk-export');
    const importBtn = document.getElementById('tk-import');
    const importFile = document.getElementById('tk-import-file');

    exportBtn.onclick = async () => {
      const originalLabel = exportBtn.textContent;
      exportBtn.textContent = "sammle Daten \u2026"; exportBtn.disabled = true;
      try{
        const bundle = JSON.parse(JSON.stringify(state));
        for(const animal of bundle.animals){
          for(const doc of (animal.documents || [])){
            try{ doc.data = await idbGet(`tierkartei-doc-${doc.id}`); }catch(e){ doc.data = null; }
          }
        }
        const blob = new Blob([JSON.stringify(bundle, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const today = new Date().toISOString().slice(0,10);
        a.href = url; a.download = `tierkartei-sicherung-${today}.json`;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
      } finally {
        exportBtn.textContent = originalLabel; exportBtn.disabled = false;
      }
    };

    importBtn.onclick = () => importFile.click();

    importFile.onchange = (e) => {
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = async () => {
        try{
          const parsed = JSON.parse(reader.result);
          if(!parsed || !Array.isArray(parsed.animals)) throw new Error('ungueltiges Format');
          if(!confirm('Diese Sicherung einspielen? Die aktuell angezeigten Daten werden dadurch ersetzt.')){ importFile.value = ''; return; }
          statusEl.textContent = "spiele Sicherung ein \u2026";
          for(const animal of parsed.animals){
            for(const doc of (animal.documents || [])){
              if(doc.data){ try{ await idbSet(`tierkartei-doc-${doc.id}`, doc.data); }catch(e){} delete doc.data; }
            }
          }
          state = parsed;
          if(!state.pastures) state.pastures = [];
          state.animals.forEach(a => {
            if(!a.treatments) a.treatments = [];
            if(!a.weights) a.weights = [];
            if(!a.documents) a.documents = [];
            if(!a.stoolSamples) a.stoolSamples = [];
          });
          if(state.animals.length && !state.animals.find(a => a.id === state.selectedId)){ state.selectedId = state.animals[0].id; }
          await save();
          render();
        }catch(err){
          alert('Diese Datei sieht nicht wie eine g\u00fcltige Tierkartei-Sicherung aus.');
        }
        importFile.value = '';
      };
      reader.readAsText(file);
    };
  }

  function escapeHtml(str){
    if(str === undefined || str === null) return "";
    return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function escapeAttr(str){ return escapeHtml(str); }

  const logoEl = document.getElementById('tk-logo');
  if(logoEl) logoEl.src = LOGO_DATA_URL;
  setupDataActions();
  load();
})();
</script>
